     class="legendT"
     id="text63">Подсказки по сборке</text>
  <text
     x="100"
     y="697"
     class="note"
     id="text64">• ESP32 LOLIN32 запитывается по USB; выход 5V (Vin) идёт на VCC TJA1050 — трансиверу нужен именно 5 В.</text>
  <text
     x="100"
     y="713"
     class="note"
     id="text65">• OLED SSD1306 питается 3.3 В от ESP32 (большинство модулей с встроенным регулятором переносят и 5 В, но 3.3 В безопаснее).</text>
  <text
     x="100"
     y="729"
     class="note"
     id="text66">• Кнопки подключаются между указанным GPIO и GND. Внутренние pull-up включены программно (INPUT_PULLUP).</text>
  <text
     x="100"
     y="745"
     class="note"
     id="text67">• CAN-шина: CANH ↔ CANH, CANL ↔ CANL. Терминатор 120 Ω нужен на обоих концах; у TJA1050 он уже встроен.</text>
  <text
     x="100"
     y="761"
     class="note"
     id="text68">• Общая земля (GND) объединена для всех модулей: ESP32, OLED, TJA1050 и alight.</text>
  <text
     x="100"
     y="777"
     class="note"
     id="text69">• Длина шлейфов CTX/CRX и I²C — короткие (до 10–15 см). При помехах возможны сбои на 1 Мбит/с.</text>
